name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Avoid spending Actions minutes on stale commits when newer changes arrive.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gold_jewelry_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gold_jewelry_erp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium for access-control browser tests
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run access-control UI browser tests
        run: pytest -q tests/test_access_control_ui_browser.py
      - name: Check inline browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html_files = sorted(Path("app/static").glob("*.html"))
          assert html_files, "No static HTML pages found"
          for index, html_file in enumerate(html_files):
              html = html_file.read_text(encoding="utf-8")
              scripts = re.findall(r"<script\b[^>]*>(.*?)</script>", html, re.DOTALL | re.IGNORECASE)
              if scripts:
                  target = Path(f"/tmp/gold-erp-inline-{index}.js")
                  target.write_text("\n".join(scripts), encoding="utf-8")
                  print(f"Extracted {len(scripts)} inline script(s) from {html_file}")
          PY
          for script in /tmp/gold-erp-inline-*.js; do
            node --check "$script"
          done
      - name: Run quote workspace runtime tests
        run: node --test tests/quote_workspace_runtime.test.js
      - name: Run dialog focus runtime tests
        run: node --test tests/dialog_focus_runtime.test.js
      - name: Run scanner cleanup runtime tests
        run: node --test tests/scanner_cleanup_runtime.test.js
      - name: Run scanner close runtime tests
        run: node --test tests/scanner_close_runtime.test.js
      - name: Run scanner detection runtime tests
        run: node --test tests/scanner_detection_runtime.test.js
      - name: Run scanner field suffix runtime tests
        run: node --test tests/scanner_field_suffix_runtime.test.js
      - name: Run home dashboard layout runtime tests
        run: node --test tests/home_dashboard_layout_runtime.test.js
      - name: Run home dashboard shortcut navigation runtime tests
        run: node --test tests/home_shortcut_navigation_runtime.test.js
      - name: Run transaction history shortcut and iPad layout runtime tests
        run: node --test tests/transaction_history_shortcut_ipad_layout_runtime.test.js
      - name: Run responsive gold price summary runtime tests
        run: node --test tests/responsive_gold_price_summary_runtime.test.js
      - name: Run category panel bulk status runtime tests
        run: node --test tests/category_panel_bulk_status_runtime.test.js
      - name: Run settings navigation runtime tests
        run: node --test tests/settings_navigation_runtime.test.js
      - name: Run mobile scroll target offset runtime tests
        run: node --test tests/mobile_scroll_target_offset_runtime.test.js
      - name: Run back-to-top reduced motion runtime tests
        run: node --test tests/back_to_top_reduced_motion_runtime.test.js
      - name: Run desktop category switch scroll runtime tests
        run: node --test tests/desktop_category_switch_scroll_runtime.test.js
      - name: Run desktop viewport visibility runtime tests
        run: node --test tests/desktop_viewport_visibility_runtime.test.js
      - name: Run quick navigation category shortcut runtime tests
        run: node --test tests/quick_nav_category_shortcuts_runtime.test.js
      - name: Run quick navigation empty search runtime tests
        run: node --test tests/quick_nav_empty_search_runtime.test.js
      - name: Run scanner startup fallback runtime tests
        run: node --test tests/scanner_startup_fallback_runtime.test.js
      - name: Run Dutch rabbit stocktake feedback runtime tests
        run: node --test tests/stocktake_bunny_feedback_runtime.test.js
      - name: Run label dialog close runtime tests
        run: node --test tests/label_dialog_close_runtime.test.js
      - name: Run sticker print formatting runtime tests
        run: node --test tests/sticker_print_formatting_runtime.test.js
      - name: Run customer order print formatting runtime tests
        run: node --test tests/customer_order_print_formatting_runtime.test.js
      - name: Run product and stock weight unit runtime tests
        run: node --test tests/product_stock_weight_unit_runtime.test.js
      - name: Run movement and purchase weight unit runtime tests
        run: node --test tests/product_stock_weight_unit_runtime.test.js
      - name: Run workspace status and unit localization runtime tests
        run: node --test tests/workspace_status_localization_runtime.test.js
      - name: Run shared blue-green visual theme tests
        run: pytest -q tests/test_shared_visual_theme.py
      - name: Run operating expense retry runtime tests
        run: node --test tests/operating_expense_retry_runtime.test.js
      - name: Run cash drawer retry runtime tests
        run: node --test tests/cash_drawer_retry_runtime.test.js
      - name: Run cash drawer operator memory runtime tests
        run: node --test tests/cash_drawer_operator_memory_runtime.test.js
      - name: Run sale and return payment retry runtime tests
        run: node --test tests/payment_retry_runtime.test.js
      - name: Run supplier payment retry runtime tests
        run: node --test tests/supplier_payment_retry_runtime.test.js
      - name: Run supplier master CRUD runtime tests
        run: node --test tests/supplier_master_crud_runtime.test.js
      - name: Run product category CRUD runtime tests
        run: node --test tests/product_category_crud_runtime.test.js
      - name: Run product activation UI runtime tests
        run: node --test tests/product_activation_ui_runtime.test.js
      - name: Run supplier offering management runtime tests
        run: node --test tests/supplier_offering_management_runtime.test.js
      - name: Run company location management runtime tests
        run: node --test tests/company_location_management_runtime.test.js
      - name: Run expense management CRUD runtime tests
        run: node --test tests/expense_management_crud_runtime.test.js
      - name: Run purchase draft edit runtime tests
        run: node --test tests/purchase_draft_edit_runtime.test.js
      - name: Run supplier bill management runtime tests
        run: node --test tests/supplier_bill_management_runtime.test.js
      - name: Run bank operation retry conflict runtime tests
        run: node --test tests/bank_operation_retry_conflict_runtime.test.js
      - name: Run inventory transfer retry runtime tests
        run: node --test tests/inventory_transfer_retry_runtime.test.js
      - name: Run inventory adjustment retry runtime tests
        run: node --test tests/inventory_adjustment_retry_runtime.test.js
      - name: Run inventory movement reconciliation runtime tests
        run: node --test tests/inventory_movement_reconciliation_runtime.test.js
      - name: Run inventory operation recovery runtime tests
        run: node --test tests/inventory_operation_recovery_runtime.test.js
      - name: Run customer order management runtime tests
        run: node --test tests/customer_order_management_runtime.test.js
      - name: Run sale draft edit runtime tests
        run: node --test tests/sale_draft_edit_runtime.test.js
      - name: Run tests
        run: pytest -q --ignore=tests/test_access_control_ui_browser.py --ignore=tests/test_access_control_ui_e2e.py
      - name: Upgrade PostgreSQL schema to head
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gold_jewelry_erp
      - name: Run inventory idempotency concurrency tests on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gold_jewelry_erp
        run: pytest -q tests/test_postgres_inventory_idempotency.py tests/test_postgres_inventory_operation_recovery.py
      - name: Run bank reconciliation scope tests on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gold_jewelry_erp
        run: pytest -q tests/test_postgres_bank_reconciliation_scope.py

      - name: Verify PostgreSQL schema and reconciliation foreign keys
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gold_jewelry_erp
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, inspect
          from app.core.config import settings

          engine = create_engine(settings.database_url)
          inspector = inspect(engine)
          tables = set(inspector.get_table_names())

          required_tables = {
              "companies",
              "sites",
              "storage_locations",
              "products",
              "sales",
              "sale_lines",
              "bank_accounts",
              "bank_transactions",
              "bank_statement_imports",
              "bank_statement_lines",
              "bank_reconciliation_snapshots",
              "permissions",
              "company_roles",
              "company_role_permissions",
              "company_membership_roles",
              "record_actors",
          }
          missing = sorted(required_tables - tables)
          assert not missing, f"Missing PostgreSQL tables: {missing}"

          bank_tx_fks = inspector.get_foreign_keys("bank_transactions")
          statement_fks = inspector.get_foreign_keys("bank_statement_lines")
          assert any(
              fk.get("referred_table") == "bank_statement_lines"
              and fk.get("constrained_columns") == ["statement_line_id"]
              for fk in bank_tx_fks
          ), "Missing bank_transactions.statement_line_id foreign key"
          assert any(
              fk.get("referred_table") == "bank_transactions"
              and fk.get("constrained_columns") == ["matched_bank_transaction_id"]
              for fk in statement_fks
          ), "Missing bank_statement_lines.matched_bank_transaction_id foreign key"

          unique_indexes = inspector.get_indexes("bank_transactions")
          assert any(
              index.get("name") == "ix_bank_transactions_statement_line"
              and index.get("unique")
              for index in unique_indexes
          ), "Missing unique statement-line adjustment index"

          check_names = {
              item.get("name")
              for item in inspector.get_check_constraints("bank_transactions")
          }
          assert {
              "ck_bank_transactions_type",
              "ck_bank_transactions_type_direction",
          }.issubset(check_names), f"Missing bank transaction checks: {check_names}"

          expected_scope_fks = {
              ("bank_statement_imports", "fk_bank_statement_imports_account_company"),
              ("bank_transactions", "fk_bank_transactions_account_company"),
              ("bank_transactions", "fk_bank_transactions_statement_line_scope"),
              ("bank_statement_lines", "fk_bank_statement_lines_account_company"),
              ("bank_statement_lines", "fk_bank_statement_lines_import_scope"),
              ("bank_statement_lines", "fk_bank_statement_lines_duplicate_scope"),
              ("bank_statement_lines", "fk_bank_statement_lines_matched_tx_scope"),
              ("bank_reconciliation_snapshots", "fk_bank_reconciliation_account_company"),
              ("bank_reconciliation_snapshots", "fk_bank_reconciliation_import_scope"),
          }
          missing_scope_fks = []
          for table, expected_name in expected_scope_fks:
              actual_names = {
                  fk.get("name") for fk in inspector.get_foreign_keys(table)
              }
              if expected_name not in actual_names:
                  missing_scope_fks.append(f"{table}.{expected_name}")
          assert not missing_scope_fks, f"Missing ownership-scope foreign keys: {missing_scope_fks}"

          bank_tx_columns = {
              column.get("name")
              for column in inspector.get_columns("bank_transactions")
          }
          assert "idempotency_key" in bank_tx_columns, (
              "Missing bank_transactions.idempotency_key column"
          )
          bank_tx_indexes = inspector.get_indexes("bank_transactions")
          assert any(
              index.get("name") == "uq_bank_transactions_company_idempotency_key"
              and index.get("unique")
              for index in bank_tx_indexes
          ), "Missing bank transaction idempotency unique index"

          cash_drawer_columns = {
              column.get("name")
              for column in inspector.get_columns("cash_drawer_movements")
          }
          assert "idempotency_key" in cash_drawer_columns, (
              "Missing cash_drawer_movements.idempotency_key column"
          )
          cash_drawer_indexes = inspector.get_indexes("cash_drawer_movements")
          assert any(
              index.get("name") == "uq_cash_drawer_movements_site_idempotency_key"
              and index.get("unique")
              for index in cash_drawer_indexes
          ), "Missing cash drawer idempotency unique index"

          print("PostgreSQL schema verification passed.")
          engine.dispose()
          PY
      - name: Verify Migration 0035 backfills existing companies and memberships
        run: |
          alembic downgrade 0034_user_identity_memberships
          python scripts/verify_migration_0035_seed.py seed
          alembic upgrade head
          python scripts/verify_migration_0035_seed.py verify
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gold_jewelry_erp
      - name: Verify full downgrade
        run: alembic downgrade base
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gold_jewelry_erp
      - name: Verify clean re-upgrade
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gold_jewelry_erp
      - name: Verify final Alembic revision
        run: |
          alembic current
          current_revision="$(alembic current)"
          head_revision="$(alembic heads)"
          echo "Current revision: $current_revision"
          echo "Head revision: $head_revision"
          current_id="$(printf "%s\n" "$current_revision" | awk '{print $1}')"
          head_id="$(printf "%s\n" "$head_revision" | awk '{print $1}')"
          test "$current_id" = "$head_id"
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gold_jewelry_erp
      - name: Run authenticated admin browser end-to-end test
        run: pytest -q tests/test_access_control_ui_e2e.py
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gold_jewelry_erp
          ENVIRONMENT: production
          ADMIN_USERNAME: ci-owner
          ADMIN_PASSWORD: ci-browser-test-password-123456
          SESSION_SECRET_KEY: ci-browser-test-secret-key-0123456789abcdef
          SESSION_COOKIE_SECURE: "false"
          GOOGLE_OAUTH_ENABLED: "false"
