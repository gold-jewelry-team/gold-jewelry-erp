<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>銀樓 ERP｜管理者登入</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f1eb;color:#25231f;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(100%,420px);padding:32px;border:1px solid #e2ddd3;border-radius:18px;background:#fff;box-shadow:0 12px 36px #30271912}
    h1{margin:0 0 8px;font-size:24px}p{margin:0 0 26px;color:#716b61;line-height:1.6}
    label{display:block;margin:18px 0 7px;font-size:14px;font-weight:650}
    input{width:100%;height:48px;padding:0 13px;border:1px solid #d6d0c6;border-radius:9px;font:inherit}
    input:focus{outline:3px solid #b68b4933;border-color:#9b7439}
    button{width:100%;height:48px;margin-top:24px;border:0;border-radius:9px;background:#302b24;color:white;font:inherit;font-weight:700;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}#message{min-height:24px;margin:14px 0 0;color:#a32d25;font-size:14px}
    .foot{margin-top:18px;text-align:center;color:#8a8378;font-size:12px}
  </style>
<link rel="stylesheet" href="/theme.css?v=botanical-jewelry-bunny-global-20261127b">
</head>
<body>
<aside class="bunny-page-guide" data-scene="welcome" role="note" aria-label="道奇兔店長小提醒"><span class="bunny-page-guide-art"><svg viewBox="0 0 100 100" role="img" aria-label="黑白道奇兔店長"><ellipse cx="38" cy="24" rx="11" ry="24" fill="#252729" transform="rotate(-13 38 24)"/><ellipse cx="64" cy="23" rx="10" ry="23" fill="#fff" stroke="#d7d8d2" stroke-width="2" transform="rotate(12 64 23)"/><path d="M29 24q8-5 15 1" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="50" cy="62" rx="34" ry="29" fill="#fff" stroke="#d7d8d2" stroke-width="2"/><path d="M22 51q2-19 25-18 14 0 20 13 3 8-3 14-11 9-26 5-14-3-16-14Z" fill="#252729"/><path d="M58 38q16-9 28 6 9 11 0 22-9 10-22 3-9-5-7-17Z" fill="#252729"/><ellipse cx="40" cy="60" rx="5" ry="6" fill="#252729"/><ellipse cx="69" cy="60" rx="5" ry="6" fill="#252729"/><circle cx="41.5" cy="58" r="1.8" fill="#fff"/><circle cx="70.5" cy="58" r="1.8" fill="#fff"/><ellipse cx="55" cy="72" rx="5" ry="3.5" fill="#e8a9a4"/><path d="M55 75q-5 6-10 1m10-1q5 6 10 1" fill="none" stroke="#8b7771" stroke-width="1.8" stroke-linecap="round"/><ellipse cx="27" cy="78" rx="10" ry="5" fill="#fff" stroke="#d7d8d2" stroke-width="1.5"/><ellipse cx="75" cy="78" rx="10" ry="5" fill="#fff" stroke="#d7d8d2" stroke-width="1.5"/><path d="m83 17 3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#e4c16e"/></svg></span><span class="bunny-page-guide-copy"><strong>道奇兔店長歡迎回來</strong><span>登入後就能開始今天的門市工作。</span></span><span class="bunny-page-guide-sparkle" aria-hidden="true">✦</span></aside>

  <main>
    <h1>銀樓進銷存管理系統</h1>
    <p>老闆請使用管理者帳號；員工請使用公司核准的 Google 帳號登入。</p>
    <button id="google-login" type="button" hidden style="margin:0 0 18px;background:#fff;color:#302b24;border:1px solid #d6d0c6">使用 Google 帳號登入</button>
    <div id="google-status" role="status" aria-live="polite"></div>
    <form id="login-form">
      <label for="username">管理者帳號</label>
      <input id="username" name="username" autocomplete="username" required maxlength="128">
      <label for="password">密碼</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="submit" type="submit">登入系統</button>
      <div id="message" role="alert" aria-live="polite"></div>
    </form>
    <div class="foot">請勿在共用或公用裝置上儲存登入資訊</div>
  </main>
  <script>
    const form=document.getElementById("login-form");
    const button=document.getElementById("submit");
    const message=document.getElementById("message");
    const googleButton=document.getElementById("google-login");
    const googleStatus=document.getElementById("google-status");
    fetch("/auth/google/config").then(r=>r.ok?r.json():{enabled:false}).then(data=>{googleButton.hidden=!data.enabled;}).catch(()=>{});
    googleButton.addEventListener("click",()=>{window.location.assign("/auth/google/start");});
    if(new URLSearchParams(window.location.search).get("google")==="connected"){
      fetch("/auth/google/status").then(async r=>{const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.detail||"無法取得 Google 登入狀態");return data;}).then(data=>{
        const messages={ACTIVE:"Google 帳號已核准，請前往員工工作區。",PENDING_APPROVAL:"Google 帳號已連結，正在等待公司管理者核准。核准前無法查看公司營運資料。",NEEDS_COMPANY_ASSIGNMENT:"Google 帳號已連結，尚待公司管理者指定所屬公司。",SUSPENDED:"此帳號目前已暫停使用，請聯絡公司管理者。",REJECTED:"此帳號申請未獲核准，請聯絡公司管理者。",COMPANY_INACTIVE:"所屬公司目前已停用，請聯絡公司管理者。"};
        googleStatus.textContent=messages[data.status]||"Google 帳號已連結。";
      }).catch(error=>{googleStatus.textContent=error.message;});
    }
    form.addEventListener("submit",async(event)=>{
      event.preventDefault();button.disabled=true;message.textContent="";
      try{
        const response=await fetch("/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:form.username.value,password:form.password.value})});
        const data=await response.json().catch(()=>({}));
        if(!response.ok)throw new Error(data.detail||data.message||"登入失敗，請稍後再試。");
        window.location.replace("/app");
      }catch(error){message.textContent=error.message||"無法連線，請稍後再試。";button.disabled=false;}
    });
  </script>
</body>
</html>
