# Isolated Phase D staging service.
# This file is intentionally separate from render.yaml so the production
# Render service continues to use only the existing production Blueprint.
services:
  - type: web
    name: gold-jewelry-erp-staging
    runtime: docker
    region: singapore
    plan: free
    branch: feature/phase-d-company-access-control
    autoDeployTrigger: off
    healthCheckPath: /health/db
    dockerfilePath: ./Dockerfile
    dockerCommand: >-
      /bin/bash -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: APP_MAINTENANCE_MODE
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: SESSION_MAX_AGE_SECONDS
        value: "43200"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: GOOGLE_OAUTH_ENABLED
        value: "false"
